# Líneas cambiadas en ~/.mame/mame.ini respecto a la configuración por defecto
# (el fichero completo se añade como config/mame.ini al sacarlo de la VM)
rompath           /home/recreativa/mame/roms
video             soft      # sin aceleración 3D; en el equipo real probar opengl
window            0         # pantalla completa
autoframeskip     1         # salta fotogramas si no llega
skip_gameinfo     1         # sin pantallas de aviso
samplerate        22050     # menos CPU para el sonido
joystick          1         # para el arcade stick
