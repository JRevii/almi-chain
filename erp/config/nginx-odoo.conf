# Nginx delante de Odoo: HTTPS con el certificado de la CA interna de Almi-Chain.
# Basado en la configuración recomendada por Odoo 19 (administration/on_premise/deploy).
# Se instala en /etc/nginx/sites-available/odoo con 04-https.sh

upstream odoo {
    server 127.0.0.1:8069;
}
upstream odoochat {
    server 127.0.0.1:8072;
}
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# HTTP -> HTTPS
server {
    listen 80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2 default_server;   # Ubuntu 24.04 trae Nginx 1.24
    server_name odoo.almichain.lan srv-odoo 10.13.10.10;

    ssl_certificate     /etc/ssl/almichain/odoo.crt;
    ssl_certificate_key /etc/ssl/almichain/odoo.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 30m;

    server_tokens off;                 # no mostrar la versión de Nginx
    client_max_body_size 50m;          # importaciones y adjuntos
    proxy_read_timeout 720s;
    proxy_connect_timeout 720s;
    proxy_send_timeout 720s;

    access_log /var/log/nginx/odoo.access.log;
    error_log  /var/log/nginx/odoo.error.log;

    # Cabeceras de seguridad (se repiten en cada location porque add_header no se hereda)
    set $hsts "max-age=31536000";

    location /websocket {
        proxy_pass http://odoochat;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cookie_flags session_id samesite=lax secure;
        add_header Strict-Transport-Security $hsts always;
    }

    location / {
        proxy_pass http://odoo;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_redirect off;
        proxy_cookie_flags session_id samesite=lax secure;
        add_header Strict-Transport-Security $hsts always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    gzip on;
    gzip_types text/css text/scss text/plain text/xml application/xml application/json application/javascript;
}
