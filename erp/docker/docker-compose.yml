# Almi-Chain · Odoo 19 Community + PostgreSQL 16 + Nginx (HTTPS)
# Se copia a /opt/almichain con 04-odoo-docker.sh. Gestión:  cd /opt/almichain && sudo docker compose ps
name: almichain

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres                          # superusuario: solo para administrar
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_super
    secrets: [pg_super, pg_odoo, pg_local]
    volumes:
      - /srv/datos/postgres:/var/lib/postgresql/data   # en el RAID 1
      - ./initdb:/docker-entrypoint-initdb.d:ro        # crea los usuarios odoo y local_app
    networks: [interna]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  odoo:
    image: odoo:19.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - /srv/datos/odoo:/var/lib/odoo                  # adjuntos (filestore), en el RAID 1
      - ./odoo.conf:/etc/odoo/odoo.conf:ro             # generado por el script; no está en Git
    networks: [interna]
    # Sin "ports": Odoo no se publica, solo Nginx llega a él por la red interna

  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    depends_on: [odoo]
    ports:
      # Publicado solo en la IP de la LAN (Docker se salta UFW; así no escucha en otra interfaz)
      - "10.13.10.10:80:80"
      - "10.13.10.10:443:443"
    volumes:
      - ./nginx/odoo.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/ssl/almichain:/etc/nginx/ssl:ro
    networks: [interna]

networks:
  interna: {}

secrets:
  pg_super:
    file: /root/secretos/pg_super.txt
  pg_odoo:
    file: /root/secretos/pg_odoo.txt
  pg_local:
    file: /root/secretos/pg_local.txt
